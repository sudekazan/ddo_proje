name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go build + lint + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: Build
        run: go build ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: backend
      - name: Test (unit + integration against PostgreSQL 16)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: docker compose up + make verify
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Cold start (time to healthy)
        run: |
          cp .env.example .env
          start=$(date +%s)
          docker compose up --build -d --wait
          echo "Sistem $(( $(date +%s) - start )) saniyede hazır" | tee -a $GITHUB_STEP_SUMMARY
          docker compose ps
      - name: make verify
        run: |
          set -o pipefail
          make verify 2>&1 | tee verify.txt
      - name: Verify table
        if: always()
        run: |
          { echo '```'; cat verify.txt || true; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - name: make reset-demo + verify again
        run: |
          make reset-demo
          make verify
      - name: Image sizes
        run: docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep dishekimim | tee -a $GITHUB_STEP_SUMMARY
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
